<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinsaguel — Tableau de chasse 2026/2027</title>
<style>
  :root{
    --navy: #0B1220;
    --navy-2: #0F1A30;
    --blue: #1E4FA0;
    --blue-light: #3568C4;
    --gold: #F4C430;
    --gold-dim: #C9A227;
    --cream: #F3EFE4;
    --win: #3FA35E;
    --loss: #C0433F;
    --draw: #8A8F98;
    --empty-line: rgba(243,239,228,0.18);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
/*    background: radial-gradient(circle at 50% 18%, var(--navy-2), var(--navy) 70%);*/
    background-color: var(--navy);
    color: var(--cream);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
  }

  .wrap{
    max-width: 900px;
    height: 100vh;
    margin: 0 auto;
    padding: 36px 20px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position: relative;
  }

  .club-logo{
    position: absolute;
    top: 20px;
    left: 20px;
    width: clamp(56px, 9vw, 88px);
    height: auto;
    z-index: 5;
  }

  .team-logo{
    position: absolute;
    top: 20px;
    right: 20px;
    width: clamp(56px, 9vw, 88px);
    height: auto;
    z-index: 5;
  }

  header{
    text-align:center;
    margin-bottom: 8px;
  }

  .club{
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-style: italic;
    font-size: clamp(34px, 7vw, 54px);
    letter-spacing: 1px;
    color: var(--gold);
    margin: 0;
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }

  .season{
    font-size: 15px;
    color: var(--cream);
    opacity: 0.75;
    margin: 4px 0 2px;
    letter-spacing: 2px;
  }

  .title-rule{
    display:flex;
    align-items:center;
    gap: 12px;
    margin: 14px 0 30px;
  }
  .title-rule .line{
    height:1px;
    width: 46px;
    background: var(--gold-dim);
    opacity:0.6;
  }
  .title-rule span{
    font-size: 13px;
    color: var(--cream);
    opacity: 0.85;
  }

  .board{
    position: relative;
    margin-top: 0px;
   /* width: min(88vw, 620px);
    aspect-ratio: 1 / 1;
    margin: 0;*/
  }

  .board.circle-mode{
    width: min(88vw, 620px);
  }

  .center-medal{
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .center-medal .ring-outer{
    position:absolute;
    inset: -14px;
    border-radius: 26%;
    border: 2px solid var(--gold-dim);
    opacity: 0.55;
  }
  .center-medal .ring-mid{
    position:absolute;
    inset: -4px;
    border-radius: 24%;
    border: 3px solid var(--gold);
  }
  .center-medal img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
    margin-top: 5px;
    opacity: 0.25;
  }

  .slots{
    position:absolute;
    inset:0;
  }

  .board:not(.circle-mode) .slots{
    position: relative;
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 35px;
    margin-top: 10px;
  }

  .slot{
    position:absolute;
    width: 35px;
    height: 35px;
    display:flex;
    align-items:center;
    justify-content:center;
    /*border-radius: 25px;*/
    border: 1.5px solid var(--empty-line);
    background: rgba(255,255,255,0.03);
    /*cursor: pointer;*/
    user-select:none;
    font-weight: 700;
    font-size: 17px;
    color: var(--cream);
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .board:not(.circle-mode) .slot{
    position: relative;
    width: 45px;
    height: 45px;
    border-radius: 10px;
  }

  .slot:hover{
    transform: scale(1.08);
    border-color: var(--gold-dim);
  }

  .slot .num{
    position:absolute;
    top: 1px;
    right: 5px;
    font-size: 9px;
    font-weight: 600;
    opacity: 0.6;
  }

  .slot[data-state="0"]{
    color: var(--cream);
    opacity: 0.85;
  }
  .slot[data-state="1"]{
    background: var(--win);
    border-color: var(--win);
    color: #0B1220;
  }
  .slot[data-state="2"]{
    background: var(--loss);
    border-color: var(--loss);
    color: #F3EFE4;
  }
  .slot[data-state="3"]{
    background: var(--draw);
    border-color: var(--draw);
    color: #0B1220;
  }

  .slot .letter{
    font-size: 12px;
    margin-top: -5px;
  }

  .slot .libelle{
    position: absolute;
    top: calc(100% + 3px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    color: var(--cream);
    opacity: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    pointer-events: none;
  }

  .slot .libelle2{
    position: absolute;
    top: calc(100% - 60px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    color: var(--cream);
    opacity: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    pointer-events: none;
  }

  .board:not(.circle-mode) .slot .libelle{
    top: auto;
    bottom: 0px;
  }

  footer{
    margin-top: 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 16px;
    width:100%;
  }

  .legend{
    display:flex;
    gap: 22px;
    flex-wrap:wrap;
    justify-content:center;
    font-size: 14px;
  }
  .legend .item{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .legend .swatch{
    width: 14px;
    height:14px;
    border-radius:4px;
  }
  .legend .swatch.win{background:var(--win);}
  .legend .swatch.loss{background:var(--loss);}
  .legend .swatch.draw{background:var(--draw);}
  .legend .swatch.empty{background:transparent; border:1.5px solid var(--empty-line);}

  .tally{
    font-size: 15px;
    color: var(--cream);
    opacity: 0.9;
    display:flex;
    gap: 18px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .tally b{ color: var(--gold); font-weight:700; }

  .reset{
    display:none;
    margin-top: 4px;
    background: transparent;
    border: 1.5px solid var(--empty-line);
    color: var(--cream);
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor:pointer;
    opacity:0.8;
  }
  .reset:hover{ border-color: var(--gold-dim); opacity:1; }

  .hint{
    font-size: 12px;
    opacity: 0.5;
    text-align:center;
    max-width: 420px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="club-logo" src="pinsaguel-logo.png" alt="Pinsaguel Basket Club">
    <img class="team-logo" src="u18f.png" alt="U18F">
    <header>
      <p class="club">Pinsaguel</p>
      <p class="season">Saison 2026 / 2027</p>
    </header>
    <div class="title-rule">
      <div class="line"></div>
      <span>Tableau de chasse</span>
      <div class="line"></div>
    </div>

    <div class="board" id="board">
      <div class="center-medal">
        <img src="pinsaguel-equipe.png" alt="Équipe de Pinsaguel - U18F">
      </div>
      <div class="slots" id="slots"></div>
    </div>

    <footer>
      <!--
      <div class="legend">
        <div class="item"><span class="swatch win"></span>Victoire</div>
        <div class="item"><span class="swatch loss"></span>Défaite</div>
        <div class="item"><span class="swatch draw"></span>Nul</div>
        <div class="item"><span class="swatch empty"></span>À jouer</div>
      </div>
    -->
      <div class="tally" id="tally"></div>
      <button class="reset" id="reset">Réinitialiser le tableau</button>
     <!-- <p class="hint">Cliquez sur une case pour faire défiler le résultat : à jouer → victoire → défaite → nul.</p> -->
    </footer>
  </div>

<script>
  
  const TOTAL = 25;
  const libelles = [
    "TCMS",
    "ASTRO",
    "OTB",
    "VERFEIL",
    "LAVEDAN",
    "OSSUN",
    "TMB",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    ""
  ];
  const etat = [
    1,
    1,
    1,
    2,
    1,
    2,
    2,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null
  ];
  const scores = [
    "32-74",
    "85-23",
    "75-26",
    "59-56",
    "49-45",
    "23-28",
    "39-77",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    ""
  ];
  const states = etat.map((statut) => {
    if (statut === 1 || statut === 2 || statut === 3) return statut;
    return 0;
  }); // 0 vide, 1 V, 2 D, 3 N
  const letters = ["", "V", "D", "N"];
  const slotsEl = document.getElementById('slots');
  const board = document.getElementById('board');
  const tallyEl = document.getElementById('tally');

  // Title en fonction du type de match
  const NB_BRASSAGE = 7;            // les NB_BRASSAGE premiers matchs
  const AMICAUX = new Set([1]);     // indices des matchs amicaux - e.g. Set([1, 12, 20])

  const typeMatch = i =>
    AMICAUX.has(i) ? 'Amical'
    : i < NB_BRASSAGE ? 'Brassage'
    : ''; // Championnat

  for(let i=0;i<TOTAL;i++){
    const el = document.createElement('div');
    el.className = 'slot';
    el.dataset.state = '0';
    el.dataset.index = i;
    el.dataset.libelle = libelles[i];
    el.title = typeMatch(i);
    el.innerHTML = '<span class="libelle">'+scores[i]+'</span><span class="num">'+(i+1)+'</span><span class="letter"></span><span class="libelle2">'+libelles[i]+'</span>';
    slotsEl.appendChild(el);
  }

  function render(){
    const slotEls = slotsEl.querySelectorAll('.slot');
    let v=0,d=0,n=0,vide=0;
    slotEls.forEach((el,i)=>{
      const s = states[i];
      el.dataset.state = s;
      const letterSpan = el.querySelector('.letter');
      letterSpan.textContent = s === 0 ? "" : letters[s];
      if(s===1) v++;
      else if(s===2) d++;
      else if(s===3) n++;
      else vide++;
    });
    tallyEl.innerHTML =
      '<span><b>'+v+'</b> victoire'+(v>1?'s':'')+'</span>' +
      '<span><b>'+d+'</b> défaite'+(d>1?'s':'')+'</span>' +
      '<span><b>'+n+'</b> nul'+(n>1?'s':'')+'</span>';
//      '<span><b>'+vide+'</b> à jouer</span>';
  }

  function layout(){
    const isDesktop = window.innerWidth >= 10000; // 640
    const slotEls = slotsEl.querySelectorAll('.slot');
    if(isDesktop){
      board.classList.add('circle-mode');
      const size = board.clientWidth;
      const radius = size/2 - 10;
      slotEls.forEach((el,i)=>{
        const angle = (i/TOTAL) * 2 * Math.PI - Math.PI/2;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        el.style.left = 'calc(50% + ' + x + 'px - 28px)';
        el.style.top = 'calc(50% + ' + y + 'px - 28px)';
      });
    } else {
      board.classList.remove('circle-mode');
      slotEls.forEach(el=>{ el.style.left=''; el.style.top=''; });
    }
  }

  document.getElementById('reset').addEventListener('click', () => {
    for(let i=0;i<TOTAL;i++){
      states[i] = 0;
      etat[i] = null;
    }
    render();
  });

  window.addEventListener('resize', layout);
  window.addEventListener('load', () => { layout(); render(); });
  layout();
  render();
</script>
</body>
</html>
